<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>ICELAB responsive QA</title>
<style>
  html,body{margin:0;background:#1b1f24;font-family:system-ui,sans-serif;color:#dfe8ef}
  .row{display:flex;gap:18px;padding:16px;align-items:flex-start}
  .dev{background:#0d1117;border:1px solid #2a3038;border-radius:10px;overflow:hidden}
  .dev h4{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.08em;color:#8fb6d4;border-bottom:1px solid #232a33}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<div class="row">
  <div class="dev"><h4>360 × 780</h4><iframe src="index.html" width="360" height="780"></iframe></div>
  <div class="dev"><h4>768 × 780</h4><iframe src="index.html" width="768" height="780"></iframe></div>
  <div class="dev"><h4>1280 × 780</h4><iframe src="index.html" width="1280" height="780"></iframe></div>
</div>
</body>
</html>
