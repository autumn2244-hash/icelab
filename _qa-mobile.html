<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>ICELAB 모바일 검수(임시)</title>
<style>
  body { margin:0; background:#0b1220; font-family:sans-serif; color:#9fb3c8; }
  .row { display:flex; gap:20px; padding:16px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { font-size:13px; padding:6px 2px; color:#8fd8f7; }
  iframe { border:1px solid #33475b; background:#fff; display:block; }
</style>
</head>
<body>
  <div class="row">
    <figure><figcaption>375px · 홈(#/)</figcaption>
      <iframe src="index.html" width="375" height="1500"></iframe></figure>
    <figure><figcaption>390px · 청소 과정(#/process)</figcaption>
      <iframe src="index.html#/process" width="390" height="1500"></iframe></figure>
    <figure><figcaption>412px · 홈(#/)</figcaption>
      <iframe src="index.html" width="412" height="1500"></iframe></figure>
  </div>
</body>
</html>
